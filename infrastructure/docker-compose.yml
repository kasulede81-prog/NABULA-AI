services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula_dev
      POSTGRES_DB: nebula_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
