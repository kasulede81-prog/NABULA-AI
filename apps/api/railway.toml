# Nebula API — Railway service configuration (monorepo)
# REQUIRED: Railway Root Directory = repository root (/.)
# REQUIRED: Config path = apps/api/railway.toml
# REQUIRED: nixpacks.toml at repo root (or apps/api/nixpacks.toml) — forces pnpm, never npm install

[build]
builder = "nixpacks"
# pnpm install runs in nixpacks [phases.install]; build only compiles packages
buildCommand = "pnpm --filter @nebula/database generate && pnpm --filter @nebula/api build"
watchPatterns = ["/apps/api/**", "/packages/**"]

[deploy]
startCommand = "sh apps/api/scripts/railway-start.sh"
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
