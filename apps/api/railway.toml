# Nebula API — Railway config-as-code (schema: https://railway.com/railway.schema.json)
# Dashboard: Root Directory = / (repo root)
# Dashboard: Config file path = /apps/api/railway.toml

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"
buildCommand = "pnpm --filter @nebula/database generate && pnpm --filter @nebula/api build"
watchPatterns = ["apps/api/**", "packages/**", "nixpacks.toml", "pnpm-lock.yaml"]

[deploy]
startCommand = "sh apps/api/scripts/railway-start.sh"
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
